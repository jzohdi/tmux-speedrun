services:
  # PostgreSQL database for local development
  db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tmux-speedrun-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tmux -d tmux_speedrun']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
