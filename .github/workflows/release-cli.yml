name: Release CLI to npm

# Publishes the cli/ workspace package to npm whenever CLI code (or the
# shared src/lib code that tsup bundles into it) lands on main, provided
# cli/package.json's version isn't already on npm. To cut a release, bump
# cli/package.json's version in your PR; when it merges, that exact version
# is published and tagged. Merges that don't change the version are a no-op
# (the publish/tag steps are skipped). Uses OIDC trusted publishing
# (configure on npmjs.com: repo jzohdi/tmux-speedrun, workflow
# release-cli.yml) — no NPM_TOKEN secret required.
#
# The workflow deliberately does NOT auto-bump the version itself: main is a
# protected branch that rejects direct pushes, so the bump must come from a
# PR. workflow_dispatch re-runs the publish for the current version if it
# isn't on npm yet; otherwise it's a no-op.

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'src/lib/**' # inlined into the CLI bundle by tsup ($lib alias)
  workflow_dispatch:

permissions:
  contents: write # push the release tag
  id-token: write # npm OIDC trusted publishing

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Matches the pnpm major Vercel resolves for this lockfile.
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Trusted publishing requires npm >= 11.5.1.
      - name: Update npm for OIDC support
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

      - name: Typecheck CLI
        working-directory: cli
        run: npm run typecheck

      - name: Build and smoke-test CLI
        working-directory: cli
        run: |
          npm run build
          node dist/index.js help

      - name: Resolve release version
        id: version
        run: |
          current="$(node -p "require('./cli/package.json').version")"
          if npm view "tmux-speedrun@${current}" version >/dev/null 2>&1; then
            # Already published. Branch protection blocks the workflow from
            # committing an auto-bump back to main, so a release requires
            # bumping cli/package.json in a PR. Nothing to do this run.
            echo "::notice::tmux-speedrun@${current} is already on npm; skipping publish. Bump cli/package.json in a PR to release a new version."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            # Version was bumped in the merged PR -> publish it as-is.
            echo "version=${current}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        working-directory: cli
        run: npm publish

      - name: Tag release
        if: steps.version.outputs.publish == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
