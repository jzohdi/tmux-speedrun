name: Release CLI to npm

# Automatically publishes the cli/ workspace package to npm whenever CLI
# code (or the shared src/lib code that tsup bundles into it) lands on
# main. If cli/package.json's version was bumped in the merge, that exact
# version is published; otherwise the patch version is bumped
# automatically and the bump is committed back to main. Uses OIDC trusted
# publishing (configure on npmjs.com: repo jzohdi/tmux-speedrun, workflow
# release-cli.yml) — no NPM_TOKEN secret required.
#
# workflow_dispatch acts as a "force release" button: it always results
# in a publish (auto-bumping if the current version is already on npm).

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'src/lib/**' # inlined into the CLI bundle by tsup ($lib alias)
  workflow_dispatch:

permissions:
  contents: write # push the auto-bump commit and release tag
  id-token: write # npm OIDC trusted publishing

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Matches the pnpm major Vercel resolves for this lockfile.
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Trusted publishing requires npm >= 11.5.1.
      - name: Update npm for OIDC support
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

      - name: Typecheck CLI
        working-directory: cli
        run: npm run typecheck

      - name: Build and smoke-test CLI
        working-directory: cli
        run: |
          npm run build
          node dist/index.js help

      - name: Resolve release version
        id: version
        run: |
          current="$(node -p "require('./cli/package.json').version")"
          if npm view "tmux-speedrun@${current}" version >/dev/null 2>&1; then
            # Version already on npm -> auto-bump patch and push it to main.
            # (A push from GITHUB_TOKEN cannot retrigger workflows, so no loop.)
            new="$(cd cli && npm version patch --no-git-tag-version)"
            new="${new#v}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cli/package.json
            git commit -m "Release tmux-speedrun ${new} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "version=${new}" >> "$GITHUB_OUTPUT"
          else
            # Version was bumped manually in the merge -> publish it as-is.
            echo "version=${current}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        working-directory: cli
        run: npm publish

      - name: Tag release
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
